name: build

# Every push and PR: host tests + the jeep (JPF20L) image, kept as a build artifact.
# A tag v<ddmmyy> also publishes a GitHub Release with the .iap and release notes.
# The tag must match the date in kVersionString (app/include/app_config.hpp),
# e.g. tag v241026 <-> H1N4JPF20L-241026, or the release step fails.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # release notes need the previous tag

      - name: Test and build (jeep only)
        run: bash build-docker.sh --protocol jeep

      - name: Locate image
        id: img
        run: |
          iap=$(ls build/canupdate*.iap)
          version=$(basename "$iap" .iap); version=${version#canupdate}
          sha256sum "$iap" | tee "$iap.sha256"
          echo "iap=$iap" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.img.outputs.version }}
          path: |
            ${{ steps.img.outputs.iap }}
            ${{ steps.img.outputs.iap }}.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.img.outputs.version }}
          IAP: ${{ steps.img.outputs.iap }}
        run: |
          if [ "${VERSION##*-}" != "${TAG#v}" ]; then
            echo "tag $TAG does not match image version $VERSION" >&2
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "Firmware \`$VERSION\` for the Hiworld JPF2 canbox (Jeep WK)."
            echo
            echo "## Changes"
            git log --no-merges --format='- %s' "$range"
            echo
            echo "## Install"
            echo "Copy \`$(basename "$IAP")\` to the root of the head unit's sdcard and run the canbox update. See the README for details and for going back to stock."
            echo
            echo "## sha256"
            echo '```'
            cat "$IAP.sha256" | sed 's#build/##'
            echo '```'
          } > notes.md
          gh release create "$TAG" "$IAP" "$IAP.sha256" --title "$VERSION" --notes-file notes.md
